<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>Live Transcription</title>
    <link rel="stylesheet" href="transcript.css" />
  </head>
  <body>
    <header>
      <span class="title">Live transcript</span>
      <span id="status" class="status">Idle</span>
      <button id="close" class="close" type="button" title="Close" aria-label="Close">&#10005;</button>
    </header>

    <div class="controls">
      <label for="langSelect">Language</label>
      <select id="langSelect"></select>
    </div>

    <div id="content" role="log" aria-live="polite" aria-label="Live transcript">
      <p class="hint" id="hint">Transcript lines appear here a few seconds after people start speaking.</p>
    </div>

    <footer>A rough live preview — the saved notes are transcribed properly after you stop.</footer>

    <script src="transcript.js"></script>
  </body>
</html>
