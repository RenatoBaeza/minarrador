<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>Quick Copy</title>
    <link rel="stylesheet" href="snippets.css" />
  </head>
  <body>
    <header>
      <span class="title">Quick copy</span>
      <span id="status" class="status">Saved</span>
      <button id="close" class="close" type="button" title="Close" aria-label="Close">&#10005;</button>
    </header>

    <div class="controls">
      <button id="add" class="button" type="button">+ New shorthand</button>
      <span class="controls-hint">Each one becomes a tray item that copies on click.</span>
    </div>

    <div id="list" class="list"></div>

    <p id="empty" class="empty">
      Nothing here yet. Add a shorthand and it appears at the top of the tray menu, ready to copy.
    </p>

    <footer>
      <span class="foot-hint">Ctrl+S saves · Esc closes</span>
      <button id="save" class="button primary" type="button">Save</button>
    </footer>

    <script src="snippets.js"></script>
  </body>
</html>
