name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the only supported target, but the pure logic is
        # platform-independent and Linux catches path assumptions early.
        os: [windows-latest, ubuntu-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The Electron binary is only needed to run the app, not to lint or test.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - run: npm run lint

      - run: npm test

  build:
    name: Build installer
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run dist

      - uses: actions/upload-artifact@v7
        with:
          name: minarrador-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
